<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JOY STORE | Official Store</title>
    
    <!-- Fonte Inter para um design limpo e profissional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- VARIÁVEIS GLOBAIS DE DESIGN --- */
        :root {
            --accent-color: #000;
            --white: #ffffff;
            --gray-light: #f4f4f4;
            --text-main: #1a1a1a;
            --sidebar-width: 280px;
            --cart-width: 380px;
            --success-color: #25D366; /* Verde WhatsApp */
            --error-color: #ff4d4d;
            --border-radius: 6px;
            --site-max-width: 1250px;
        }

        /* --- RESET BÁSICO --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--white);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.4;
            font-size: 15px;
        }

        /* --- ANIMAÇÕES --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .error-shake { animation: shake 0.3s ease-in-out 2; border: 1.5px solid var(--error-color) !important; }

        /* --- CABEÇALHO (HEADER) --- */
        header {
            background: #fff;
            padding-top: 15px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1001;
            width: 100%;
        }
        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            max-width: 100%;
            padding: 0 40px 10px;
            min-height: 50px;
        }
        .menu-trigger {
            display: none; 
            position: absolute;
            left: 30px;
            background: none;
            border: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            z-index: 1020;
        }
        .menu-trigger span { display: block; width: 24px; height: 2px; background: #000; }
        header h1 {
            font-size: 1.8rem;
            letter-spacing: 10px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            margin: 0;
        }
        .cart-trigger {
            position: absolute;
            right: 30px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            z-index: 1020;
        }
        .cart-icon-svg { width: 28px; height: 28px; fill: none; stroke: #000; stroke-width: 1.5; }
        .cart-badge {
            position: absolute; top: -2px; right: -2px;
            background: red; color: #fff; font-size: 0.6rem;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
        }

        /* --- NAVEGAÇÃO DESKTOP --- */
        .nav-bar { display: flex; padding: 10px 30px 15px; text-align: center; justify-content: center; }
        .nav-links-center { display: flex; gap: 40px; justify-content: center; width: 100%; }
        .nav-link-item {
            text-decoration: none; color: #000; font-size: 0.8rem;
            font-weight: 800; text-transform: uppercase; padding-bottom: 5px;
            border-bottom: 3px solid transparent; transition: 0.2s;
            cursor: pointer;
        }
        .nav-link-item.active { border-bottom-color: #000; }

        /* --- ÁREAS DE CONTEÚDO --- */
        main { flex: 1; width: 100%; position: relative; z-index: 1; }

        /* --- HOME E CARROSSEL --- */
        .home-carousel { width: 100%; height: 80vh; position: relative; overflow: hidden; background: #000; }
        .carousel-track { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; }
        .carousel-slide { min-width: 100%; height: 100%; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.9; }

        /* --- VITRINE DE PRODUTOS --- */
        #category-view { display: none; padding: 50px 0; max-width: var(--site-max-width); margin: 0 auto; }
        .category-header { width: 100%; text-align: center; margin-bottom: 50px; }
        .category-header h2 { 
            font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            display: inline-block; border-bottom: 4px solid #000; padding: 0 15px 8px;
        }
        .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; padding: 0 30px; }
        .product-card-vitrine { display: flex; flex-direction: column; cursor: pointer; }
        .vitrine-img-box { aspect-ratio: 2/3; background: #f9f9f9; overflow: hidden; border-radius: 4px; }
        .vitrine-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .vitrine-info { padding: 15px 0; }
        .vitrine-name { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #333; margin-bottom: 8px; height: 2.8em; overflow: hidden; }
        .vitrine-price { font-size: 1.1rem; font-weight: 900; color: #000; }

        /* --- PÁGINA DE DETALHES --- */
        #product-detail-view { display: none; padding: 40px 30px; max-width: 1200px; margin: 0 auto; }
        .breadcrumb { font-size: 0.75rem; color: #999; margin-bottom: 30px; text-transform: uppercase; cursor: pointer; font-weight: 700; }
        .detail-layout { display: flex; flex-direction: row; gap: 60px; align-items: flex-start; }
        .detail-left { flex: 1.1; max-width: 500px; position: relative; }
        .detail-main-img-container { 
            width: 100%; aspect-ratio: 2/3.2; background: #f9f9f9; border-radius: 12px; 
            overflow: hidden; position: relative;
        }
        .detail-carousel-track { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); will-change: transform; }
        .detail-carousel-track img { min-width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }

        .detail-right { flex: 0.9; display: flex; flex-direction: column; }
        .detail-title { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        .detail-price { font-size: 2.2rem; font-weight: 900; margin-bottom: 35px; border-top: 2px solid #eee; padding-top: 20px; }
        
        .option-label { font-size: 0.85rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; display: block; }
        .size-grid, .color-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 35px; }
        .size-btn { border: 2px solid #ddd; padding: 12px; min-width: 60px; text-align: center; cursor: pointer; font-weight: 800; border-radius: 4px; font-size: 1rem; }
        .size-btn.active { background: #000; color: #fff; border-color: #000; }
        .color-circle { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #ddd; cursor: pointer; transition: 0.2s; }
        .color-circle.active { border: 2.5px solid #000; outline: 1.5px solid #000; outline-offset: 4px; }

        /* BOTÃO ADICIONAR */
        .btn-add-cart-large { 
            background: #000; color: #fff; border: none; padding: 22px; width: 100%; max-width: 320px; 
            margin-top: 10px; font-weight: 900; text-transform: uppercase; border-radius: 4px; 
            cursor: pointer; font-size: 1rem; transition: transform 0.2s;
        }
        .btn-add-cart-large:active { transform: scale(0.97); }

        /* --- CARRINHO --- */
        #cart-drawer { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: var(--cart-width); 
            height: 100dvh; background: #fff; z-index: 2000; 
            display: flex; flex-direction: column; transition: 0.4s; box-shadow: -10px 0 30px rgba(0,0,0,0.1); 
        }
        #cart-drawer.open { right: 0; }
        .cart-header { padding: 25px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #f9f9f9; padding-bottom: 15px; align-items: center; position: relative; }
        .cart-item img { width: 70px; height: 95px; object-fit: cover; border-radius: 4px; }
        
        /* --- NOVO DESIGN BOTÕES QUANTIDADE --- */
        .qty-controls-modern {
            display: flex;
            align-items: center;
            background: #f8f8f8;
            border-radius: 50px;
            padding: 4px;
            width: fit-content;
            margin-top: 10px;
            border: 1px solid #eee;
        }
        .qty-btn-modern {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }
        .qty-btn-modern:hover {
            background: #000;
            color: #fff;
        }
        .qty-btn-modern:active {
            transform: scale(0.9);
        }
        .qty-val-modern {
            font-size: 0.85rem;
            font-weight: 800;
            min-width: 35px;
            text-align: center;
            color: #000;
        }

        .cart-footer { padding: 25px 20px; border-top: 1px solid #eee; background: #fff; }
        .btn-checkout { background: var(--success-color); color: #fff; border: none; width: 100%; padding: 20px; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 4px; font-size: 1rem; }

        /* --- MODAIS --- */
        #confirm-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5000; display: none; align-items: center; justify-content: center; }
        .confirm-box { background: #fff; padding: 30px; border-radius: 12px; max-width: 380px; width: 90%; text-align: center; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }
        .overlay.active { display: block; }
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 15px 30px; border-radius: 50px; z-index: 9999; transition: 0.4s; }
        #toast.visible { bottom: 30px; }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 767px) {
            .menu-trigger { display: flex; left: 20px; }
            .nav-bar { display: none; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 15px; }
            .btn-add-cart-large { max-width: 90%; margin: 30px auto 0; }
        }

        #image-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 4000; display: none; align-items: center; justify-content: center; }
        #image-viewer img { max-width: 90%; max-height: 90%; object-fit: contain; }
    </style>
</head>
<body>

<!-- Overlay para fechar menus -->
<div class="overlay" id="overlay" onclick="window.closeAllMenus()"></div>

<!-- Modal de Sucesso -->
<div id="confirm-modal">
    <div class="confirm-box">
        <h4 style="font-weight:900;">Item Adicionado!</h4>
        <p style="margin: 15px 0; color: #666;">Deseja finalizar ou continuar?</p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button onclick="window.confirmGoToCart()" style="background:#000; color:#fff; border:none; padding:16px; border-radius:6px; font-weight:800; cursor:pointer; text-transform:uppercase;">Ir para o Carrinho</button>
            <button onclick="window.closeConfirmModal()" style="background:#f4f4f4; color:#000; border:none; padding:16px; border-radius:6px; font-weight:700; cursor:pointer; text-transform:uppercase;">Continuar Comprando</button>
        </div>
    </div>
</div>

<div id="image-viewer" onclick="this.style.display='none'"><img id="full-image" src=""></div>

<header>
    <div class="header-top">
        <button class="menu-trigger" onclick="window.openSidebar()">
            <span></span><span></span><span></span>
        </button>
        <h1 onclick="window.goToHome()">JOY STORE</h1>
        <button class="cart-trigger" onclick="window.toggleCart()">
            <svg class="cart-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1H4L6.68 14.39C6.80409 15.0113 7.15175 15.5658 7.66239 15.9575C8.17303 16.3491 8.81079 16.5524 9.46 16.53H18.91C19.5592 16.5524 20.197 16.3491 20.7076 15.9575C21.2183 15.5658 21.5659 15.0113 21.69 14.39L23 6H6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="9" cy="21" r="1.5" stroke="none" fill="currentColor"/>
                <circle cx="19" cy="21" r="1.5" stroke="none" fill="currentColor"/>
            </svg>
            <span class="cart-badge" id="cart-badge">0</span>
        </button>
    </div>
    <div class="nav-bar">
        <nav class="nav-links-center">
            <div class="nav-link-item active" id="link-home" onclick="window.goToHome()">HOME</div>
            <div class="nav-link-item" id="link-fitness" onclick="window.showCategory('fitness')">FITNESS</div>
            <div class="nav-link-item" id="link-casual" onclick="window.showCategory('casual')">MODA ÍNTIMA</div>
        </nav>
    </div>
</header>

<main>
    <div id="home-view">
        <div class="home-carousel">
            <div class="carousel-track" id="mainCarousel">
                <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=1600"></div>
                <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1518310383802-640c2de311b2?w=1600"></div>
                <div class="carousel-slide"><img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=1600"></div>
            </div>
        </div>
    </div>
    <div id="category-view">
        <div class="category-header"><h2 id="cat-title-display"></h2></div>
        <div class="product-grid" id="category-grid"></div>
    </div>
    <div id="product-detail-view"></div>
</main>

<aside id="cart-drawer">
    <div class="cart-header"><h3 style="font-weight:900;">CARRINHO</h3><button style="background:none; border:none; font-size:1.5rem; cursor:pointer;" onclick="window.toggleCart()">✕</button></div>
    <div class="cart-items" id="cart-items-container"></div>
    <div class="cart-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:900; font-size: 1.3rem;"><span>TOTAL:</span><span id="cart-total-value">R$ 0,00</span></div>
        <button class="btn-checkout" onclick="window.checkoutWhatsApp()">Finalizar via WhatsApp</button>
    </div>
</aside>

<footer style="background:#000; color:#fff; padding: 40px 20px; text-align:center;">
    <p style="font-weight:900; letter-spacing: 2px;">JOY STORE</p>
    <p style="font-size: 0.75rem; color:#666; margin-top: 10px;">© 2026 JOY STORE OFFICIAL. TODOS OS DIREITOS RESERVADOS.</p>
</footer>

<div id="toast">Feedback</div>

<script>
    // --- ESTADO GLOBAL ---
    let cart = [];
    let activeProduct = null;
    let activeVariation = null;
    let selectedSize = null;
    let selectedColorName = null;
    let currentTotalPrice = 0;
    let toastTimeout = null;

    // --- PRODUTOS ---
    const products = [
        { 
            id: 'fit1', 
            category: 'fitness', 
            name: 'Top Elite Compression', 
            priceNumeric: 89.90,
            variations: [
                { color: 'Preto', hex: '#000', images: ['https://github.com/eder201318/fotos/blob/main/IMG-20260206-WA0053.jpg?raw=true', 'https://github.com/eder201318/fotos/blob/main/IMG-20260206-WA0054.jpg?raw=true'], sizes: ['P', 'M'] },
                { color: 'Bronze', hex: '#8b7355', images: ['https://github.com/eder201318/fotos/blob/main/IMG-20260206-WA0058.jpg?raw=true'], sizes: ['P', 'M', 'G'] }
            ]
        },
        { 
            id: 'fit3', 
            category: 'fitness', 
            name: 'Legging High Power', 
            priceNumeric: 129.90,
            variations: [
                { color: 'Preto', hex: '#000', images: ['https://github.com/eder201318/fotos/blob/main/IMG-20260206-WA0057.jpg?raw=true'], sizes: ['P', 'M', 'G'] },
                { color: 'Azul', hex: '#1a2a6c', images: ['https://github.com/eder201318/fotos/blob/main/IMG-20260206-WA0060.jpg?raw=true'], sizes: ['M', 'G', 'GG'] }
            ]
        }
    ];

    // --- NAVEGAÇÃO ---
    window.goToHome = (push = true) => {
        window.closeAllMenus();
        hideAllViews();
        document.getElementById('home-view').style.display = 'block';
        updateNavLinks('home');
        if (push) window.location.hash = 'home';
        window.scrollTo(0,0);
    };

    window.showCategory = (cat, push = true) => {
        window.closeAllMenus();
        hideAllViews();
        document.getElementById('category-view').style.display = 'block';
        document.getElementById('cat-title-display').innerText = cat === 'casual' ? 'Moda Íntima' : cat.toUpperCase();
        renderCategoryGrid(cat);
        updateNavLinks(cat);
        if (push) window.location.hash = 'category-' + cat;
        window.scrollTo(0,0);
    };

    window.openDetail = (id, push = true) => {
        const prod = products.find(p => p.id === id);
        if(!prod) return window.goToHome();
        
        activeProduct = prod;
        activeVariation = prod.variations[0];
        selectedColorName = activeVariation.color;
        selectedSize = null;

        window.closeAllMenus();
        hideAllViews();
        document.getElementById('product-detail-view').style.display = 'block';
        if (push) window.location.hash = 'product-' + id;
        window.scrollTo(0,0);
        renderDetailView();
    };

    window.setColor = (colorName) => {
        const variation = activeProduct.variations.find(v => v.color === colorName);
        if(variation) {
            activeVariation = variation;
            selectedColorName = colorName;
            selectedSize = null;
            renderDetailView();
        }
    };

    window.setSize = (size) => {
        selectedSize = size;
        renderDetailView();
    };

    function renderDetailView() {
        const dv = document.getElementById('product-detail-view');
        if(!activeProduct || !activeVariation) return;

        dv.innerHTML = `
            <div class="breadcrumb" onclick="window.showCategory('${activeProduct.category}')">← Voltar</div>
            <div class="detail-layout">
                <div class="detail-left">
                    <div class="detail-main-img-container">
                        <div class="detail-carousel-track">
                            ${activeVariation.images.map(img => `<img src="${img}" onclick="window.zoom('${img}')">`).join('')}
                        </div>
                    </div>
                </div>
                <div class="detail-right">
                    <h2 class="detail-title">${activeProduct.name}</h2>
                    <div class="detail-price">R$ ${activeProduct.priceNumeric.toFixed(2).replace('.', ',')}</div>
                    
                    <span class="option-label">Cor: <strong>${selectedColorName}</strong></span>
                    <div class="color-grid">
                        ${activeProduct.variations.map(v => `
                            <div class="color-circle ${v.color === selectedColorName ? 'active' : ''}" 
                                 style="background:${v.hex}" 
                                 onclick="window.setColor('${v.color}')">
                            </div>
                        `).join('')}
                    </div>

                    <span class="option-label">Tamanho:</span>
                    <div class="size-grid">
                        ${activeVariation.sizes.map(s => `
                            <div class="size-btn ${selectedSize === s ? 'active' : ''}" 
                                 onclick="window.setSize('${s}')">${s}</div>
                        `).join('')}
                    </div>

                    <button class="btn-add-cart-large" onclick="window.addToCart()">ADICIONAR AO CARRINHO</button>
                </div>
            </div>`;
    }

    function renderCategoryGrid(f) {
        const g = document.getElementById('category-grid');
        g.innerHTML = products.filter(p => p.category === f).map(p => `
            <div class="product-card-vitrine" onclick="window.openDetail('${p.id}')">
                <div class="vitrine-img-box"><img src="${p.variations[0].images[0]}"></div>
                <div class="vitrine-info">
                    <div class="vitrine-name">${p.name}</div>
                    <div class="vitrine-price">R$ ${p.priceNumeric.toFixed(2).replace('.', ',')}</div>
                </div>
            </div>`).join('');
    }

    // --- CARRINHO ---
    window.addToCart = () => {
        if (!selectedSize) {
            showToast("⚠️ Selecione um tamanho!");
            return;
        }

        const item = {
            cartId: Date.now(),
            name: activeProduct.name,
            price: activeProduct.priceNumeric,
            size: selectedSize,
            color: selectedColorName,
            img: activeVariation.images[0],
            quantity: 1
        };

        const existing = cart.find(i => i.name === item.name && i.size === item.size && i.color === item.color);
        if(existing) existing.quantity++;
        else cart.push(item);

        if (window.syncCart) window.syncCart(cart);
        window.updateCartUI();
        document.getElementById('confirm-modal').style.display = 'flex';
    };

    // --- ATUALIZAÇÃO DO CARRINHO COM NOVO DESIGN DE BOTÕES ---
    window.updateCartUI = () => {
        const container = document.getElementById('cart-items-container');
        let total = 0;
        document.getElementById('cart-badge').innerText = cart.reduce((a, b) => a + b.quantity, 0);
        
        if(cart.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#999; margin-top:50px;">Vazio.</p>`;
            document.getElementById('cart-total-value').innerText = "R$ 0,00";
            return;
        }

        container.innerHTML = cart.map(item => {
            total += (item.price * item.quantity);
            return `
            <div class="cart-item">
                <img src="${item.img}">
                <div style="flex:1">
                    <div style="font-weight:700; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px;">${item.name}</div>
                    <div style="font-size:0.7rem; color:#888; margin-top:2px;">Tam: ${item.size} | Cor: ${item.color}</div>
                    <div style="font-weight:900; margin-top:4px; font-size:0.95rem;">R$ ${item.price.toFixed(2).replace('.', ',')}</div>
                    
                    <!-- DESIGN MODERNIZADO DE CONTROLE DE QUANTIDADE -->
                    <div class="qty-controls-modern">
                        <button class="qty-btn-modern" onclick="window.changeQty(${item.cartId}, -1)">−</button>
                        <span class="qty-val-modern">${item.quantity}</span>
                        <button class="qty-btn-modern" onclick="window.changeQty(${item.cartId}, 1)">+</button>
                    </div>
                </div>
                <button onclick="window.removeItem(${item.cartId})" style="border:none; color:#ddd; background:none; cursor:pointer; font-size:1.2rem; align-self:flex-start; margin-top:5px;">✕</button>
            </div>`;
        }).join('');
        currentTotalPrice = total;
        document.getElementById('cart-total-value').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    };

    window.changeQty = (id, delta) => {
        const i = cart.find(x => x.cartId === id);
        if(i) {
            i.quantity += delta;
            if(i.quantity <= 0) cart = cart.filter(x => x.cartId !== id);
            if (window.syncCart) window.syncCart(cart);
            window.updateCartUI();
        }
    };

    window.removeItem = (id) => {
        cart = cart.filter(x => x.cartId !== id);
        if (window.syncCart) window.syncCart(cart);
        window.updateCartUI();
    };

    // --- FINALIZAR VIA WHATSAPP ---
    window.checkoutWhatsApp = () => {
        if (cart.length === 0) return;
        const phone = "91985866932";
        const siteLink = "https://joystore-official.com"; 
        
        let msg = `🛒 *NOVO PEDIDO - JOY STORE OFFICIAL*\n`;
        msg += `🔗 Site: ${siteLink}\n\n`;
        msg += `--- ITENS DO PEDIDO ---\n\n`;
        
        cart.forEach((item, i) => {
            msg += `${i+1}. *${item.name}* (Qtd: ${item.quantity})\n`;
            msg += `📏 Tam: ${item.size} | 🎨 Cor: ${item.color}\n`;
            msg += `💰 R$ ${item.price.toFixed(2).replace('.', ',')} cada\n`;
            msg += `📷 Foto: ${item.img}\n\n`;
        });
        
        msg += `--------------------------\n`;
        msg += `*TOTAL DO PEDIDO: R$ ${currentTotalPrice.toFixed(2).replace('.', ',')}*`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        
        cart = []; 
        if (window.syncCart) window.syncCart(cart); 
        window.updateCartUI(); 
        window.closeAllMenus();
    };

    // --- AUXILIARES UI ---
    function hideAllViews() { 
        document.getElementById('home-view').style.display = 'none'; 
        document.getElementById('category-view').style.display = 'none'; 
        document.getElementById('product-detail-view').style.display = 'none'; 
    }
    function updateNavLinks(id) { 
        document.querySelectorAll('.nav-link-item').forEach(l => l.classList.remove('active'));
        document.getElementById('link-'+id)?.classList.add('active');
    }
    window.openSidebar = () => { document.querySelector('.overlay').classList.add('active'); };
    window.toggleCart = () => { document.getElementById('cart-drawer').classList.toggle('open'); document.querySelector('.overlay').classList.toggle('active'); };
    window.closeAllMenus = () => {
        document.getElementById('cart-drawer').classList.remove('open');
        document.querySelector('.overlay').classList.remove('active');
        document.getElementById('confirm-modal').style.display = 'none';
    };
    window.closeConfirmModal = () => document.getElementById('confirm-modal').style.display = 'none';
    window.confirmGoToCart = () => { window.closeConfirmModal(); window.toggleCart(); };
    window.zoom = (src) => { document.getElementById('full-image').src = src; document.getElementById('image-viewer').style.display = 'flex'; };
    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.classList.add('visible');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => t.classList.remove('visible'), 3000);
    }

    // Carrossel Home
    let slideIdx = 0;
    setInterval(() => {
        const track = document.getElementById('mainCarousel');
        if(track && document.getElementById('home-view').style.display !== 'none') {
            slideIdx = (slideIdx + 1) % 3;
            track.style.transform = `translateX(-${slideIdx * 100}%)`;
        }
    }, 4000);

    window.onload = () => { window.goToHome(false); };
</script>

<!-- FIREBASE SYNC -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'joy-store-prod';

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const cartRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'cart');
            onSnapshot(cartRef, (snap) => {
                if (snap.exists() && snap.data().items && cart.length === 0) {
                    cart = snap.data().items;
                    window.updateCartUI();
                }
            });
            window.syncCart = async (items) => {
                await setDoc(cartRef, { items: items });
            };
        } else {
            await signInAnonymously(auth);
        }
    });
</script>
